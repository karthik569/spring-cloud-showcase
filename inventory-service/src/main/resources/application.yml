server:
  port: 8082

spring:
  application:
    name: inventory-service
  config:
    import: "optional:configserver:http://localhost:8888"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

app:
  greeting: "Default local greeting (Config Server fallback)"
  warehouse-location: "Default-Warehouse"

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,env
